<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MiniBiz - Đăng nhập</title>
  </head>

  <body>
    <main>
      <section>
        <h1>MiniBiz</h1>
        <p>Trợ lý quản lý kinh doanh thông minh</p>

        <h2>Đăng nhập</h2>

        <form>
          <div>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="Nhập email của bạn"
              required
            />
          </div>

          <div>
            <label for="password">Mật khẩu</label>
            <input
              type="password"
              id="password"
              placeholder="Nhập mật khẩu"
              required
            />
          </div>

          <button type="submit">Đăng nhập</button>
        </form>

        <p>
          Chưa có tài khoản?
          <a href="register.html">Đăng ký ngay</a>
        </p>
      </section>
    </main>
  </body>
</html>
